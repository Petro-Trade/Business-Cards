<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petro Trade – Contact Card</title>
<style>
  :root {
    --purple: #9B26B6;   /* Pantone 2592 C */
    --green:  #97D700;   /* Pantone 375 C  */
    --ink:    #1f1f24;
    --muted:  #6b6b76;
    --bg:     #f3f2f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 18px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(30, 10, 40, .12);
  }
  .top {
    background: var(--purple); padding: 28px 24px 22px; color: #fff; position: relative;
  }
  .top::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--green);
  }
  .logo { height: 44px; display: block; background: #fff; border-radius: 8px; padding: 6px 10px; }
  .wordmark {
    display: inline-block; background: #fff; border-radius: 8px; padding: 6px 12px;
    font-weight: 800; font-size: 22px; letter-spacing: -.3px;
  }
  .wordmark .p { color: var(--purple); }
  .wordmark .t { color: #6a9a00; }
  .name { font-size: 26px; font-weight: 700; margin-top: 20px; line-height: 1.15; }
  .title { font-size: 15px; opacity: .9; margin-top: 4px; }
  .body { padding: 18px 24px 8px; }
  .row {
    display: flex; align-items: center; gap: 14px; padding: 12px 0;
    border-bottom: 1px solid #eee; text-decoration: none; color: var(--ink);
  }
  .row:last-child { border-bottom: 0; }
  .ico {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: #f4e9f8; color: var(--purple);
    display: flex; align-items: center; justify-content: center;
  }
  .ico svg { width: 18px; height: 18px; fill: currentColor; }
  .label { font-size: 12px; color: var(--muted); }
  .val { font-size: 15px; word-break: break-word; }
  .actions { padding: 8px 24px 24px; display: grid; gap: 10px; }
  button, .btn {
    font: inherit; font-weight: 600; font-size: 16px; border: 0; border-radius: 12px;
    padding: 14px; cursor: pointer; width: 100%; text-align: center; text-decoration: none;
  }
  .primary { background: var(--purple); color: #fff; }
  .secondary { background: #f4e9f8; color: var(--purple); }
  .foot { text-align: center; font-size: 12px; color: var(--muted); padding: 0 24px 20px; }
  .msg { padding: 40px 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="card" id="card"><div class="msg">Loading…</div></div>

<script>
const ICONS = {
  mobile: '<svg viewBox="0 0 24 24"><path d="M17 1H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm-5 21a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5-4H7V4h10v14z"/></svg>',
  phone:  '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>',
  email:  '<svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>',
  web:    '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.9a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4a14 14 0 0 1 1.9 4h-3.8A14 14 0 0 1 12 4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4zm.8 2h2.9a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.3-3.6A15.7 15.7 0 0 0 8 8zm4 12a14 14 0 0 1-1.9-4h3.8A14 14 0 0 1 12 20zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6a15.7 15.7 0 0 0 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4z"/></svg>',
  addr:   '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>',
  li:     '<svg viewBox="0 0 24 24"><path d="M20.4 2H3.6A1.6 1.6 0 0 0 2 3.6v16.8A1.6 1.6 0 0 0 3.6 22h16.8a1.6 1.6 0 0 0 1.6-1.6V3.6A1.6 1.6 0 0 0 20.4 2zM8 19H5V9h3zM6.5 7.7A1.75 1.75 0 1 1 8.25 6 1.75 1.75 0 0 1 6.5 7.7zM19 19h-3v-4.9c0-1.2 0-2.7-1.6-2.7S12.5 12.7 12.5 14v5h-3V9h2.9v1.4a3.2 3.2 0 0 1 2.8-1.6c3 0 3.6 2 3.6 4.6z"/></svg>'
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const vesc = s => String(s ?? "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
const telHref = s => "tel:" + String(s).replace(/[^\d+]/g, "");

function buildVCard(p, c) {
  const L = [
    "BEGIN:VCARD", "VERSION:3.0",
    `N:${vesc(p.lastName)};${vesc(p.firstName)};;;`,
    `FN:${vesc([p.firstName, p.lastName].filter(Boolean).join(" "))}`,
    `ORG:${vesc(c.name)}`
  ];
  if (p.title)   L.push(`TITLE:${vesc(p.title)}`);
  if (p.mobile)  L.push(`TEL;TYPE=CELL:${p.mobile}`);
  if (p.phone)   L.push(`TEL;TYPE=WORK,VOICE:${p.phone}`);
  else if (c.phone) L.push(`TEL;TYPE=WORK,VOICE:${c.phone}`);
  if (p.email)   L.push(`EMAIL;TYPE=INTERNET,WORK:${p.email}`);
  if (c.website) L.push(`URL:${c.website}`);
  if (p.linkedin) L.push(`X-SOCIALPROFILE;TYPE=linkedin:${p.linkedin}`);
  if (c.street || c.city)
    L.push(`ADR;TYPE=WORK:;;${vesc(c.street)};${vesc(c.city)};${vesc(c.region)};${vesc(c.postcode)};${vesc(c.country)}`);
  L.push("END:VCARD");
  return L.join("\r\n") + "\r\n";
}

function row(icon, label, value, href) {
  const inner = `<div class="ico">${ICONS[icon]}</div><div><div class="label">${label}</div><div class="val">${esc(value)}</div></div>`;
  return href ? `<a class="row" href="${esc(href)}" target="${href.startsWith('http') ? '_blank' : '_self'}" rel="noopener">${inner}</a>`
              : `<div class="row">${inner}</div>`;
}

async function init() {
  const el = document.getElementById("card");
  const params = new URLSearchParams(location.search);
  const id = (params.get("id") || location.hash.slice(1) || "").toLowerCase();

  let data;
  try {
    const res = await fetch("staff.json", { cache: "no-store" });
    data = await res.json();
  } catch (e) {
    el.innerHTML = '<div class="msg">Could not load contact details.</div>';
    return;
  }
  const c = data.company;
  const p = data.people.find(x => x.id.toLowerCase() === id);
  if (!p) {
    el.innerHTML = '<div class="msg">Contact not found.</div>';
    return;
  }

  const full = [p.firstName, p.lastName].filter(Boolean).join(" ");
  document.title = `${full} – ${c.name}`;
  const addr = [c.street, c.city, c.region, c.postcode, c.country].filter(Boolean).join(", ");

  el.innerHTML = `
    <div class="top">
      <img class="logo" src="logo.png" alt="${esc(c.name)}"
           onerror="this.outerHTML='<span class=&quot;wordmark&quot;><span class=&quot;p&quot;>Petro</span> <span class=&quot;t&quot;>Trade</span></span>'">
      <div class="name">${esc(full)}</div>
      ${p.title ? `<div class="title">${esc(p.title)}</div>` : ""}
    </div>
    <div class="body">
      ${p.mobile ? row("mobile", "Mobile", p.mobile, telHref(p.mobile)) : ""}
      ${(p.phone || c.phone) ? row("phone", "Office", p.phone || c.phone, telHref(p.phone || c.phone)) : ""}
      ${p.email ? row("email", "Email", p.email, "mailto:" + p.email) : ""}
      ${c.website ? row("web", "Website", c.website.replace(/^https?:\/\//, ""), c.website) : ""}
      ${p.linkedin ? row("li", "LinkedIn", "View profile", p.linkedin) : ""}
      ${addr ? row("addr", "Address", addr, "https://maps.google.com/?q=" + encodeURIComponent(addr)) : ""}
    </div>
    <div class="actions">
      <button class="primary" id="save">Save Contact</button>
      <button class="secondary" id="share">Share this card</button>
    </div>
    <div class="foot">${esc(c.name)}</div>`;

  const vcf = buildVCard(p, c);
  document.getElementById("save").onclick = () => {
    const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${full.replace(/\s+/g, "_")}.vcf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  document.getElementById("share").onclick = async () => {
    const url = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: `${full} – ${c.name}`, url }); } catch (e) {}
    } else {
      await navigator.clipboard.writeText(url);
      document.getElementById("share").textContent = "Link copied ✓";
    }
  };
}
init();
</script>
</body>
</html>
